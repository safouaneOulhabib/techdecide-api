# Dev profile — activate with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# or: java -jar app.jar --spring.profiles.active=dev
# or: SPRING_PROFILES_ACTIVE=dev environment variable

# Verbose SQL in dev
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# DataInitializer runs automatically when this profile is active
logging.level.com.techdecide.api.config.DataInitializer=INFO
